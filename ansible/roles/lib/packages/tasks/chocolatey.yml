---
- name: "Packages | Manage Chocolatey packages for {{ install_label }}"
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    choco_args: "{{ item.choco_args | default(omit) }}"
  loop: "{{ install_chocolatey_packages }}"
  register: packages_chocolatey_result
  until: packages_chocolatey_result is succeeded
  retries: "{{ packages_retries }}"
  delay: "{{ packages_retry_delay }}"
