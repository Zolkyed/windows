---
- name: Configure WSL
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: WSL | Fully upgrade APT packages
      tags: always
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

  roles:
    - role: wsl/gpg
      tags: gpg
    - role: wsl/shell
      tags: shell
    - role: wsl/mise
      tags: mise
    - role: wsl/dotfiles
      tags: dotfiles
